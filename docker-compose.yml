services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: solarops
      POSTGRES_PASSWORD: solarops
      POSTGRES_DB: solarops
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solarops -d solarops"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-service:
    build: ./apps/ai-service
    environment:
      AI_PROVIDER: mock
    ports:
      - "8001:8001"

  api-rust:
    build: ./apps/api-rust
    environment:
      DATABASE_URL: postgres://solarops:solarops@db:5432/solarops
      AI_SERVICE_URL: http://ai-service:8001
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_started
    ports:
      - "8080:8080"

  web:
    build: ./apps/web
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    depends_on:
      - api-rust
    ports:
      - "5173:5173"
